name: PolarSense CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  firmware-build-and-test:
    name: Firmware C Host Build & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc cmake make

      - name: Configure CMake
        run: cmake -B firmware/build -S firmware

      - name: Build Firmware Targets
        run: cmake --build firmware/build --config Release

      - name: Run Firmware Host Simulation
        run: ./firmware/build/polarsense_host

      - name: Run Firmware Unit Tests
        run: ./firmware/build/test_runner

  simulation-regression-test:
    name: Simulation & Locked Figures Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run check_deck_numbers.py Regression Test
        run: python simulation/check_deck_numbers.py

      - name: Run Physics Calculations
        run: python simulation/physics.py

      - name: Run Cost Comparison
        run: python simulation/cost_comparison.py

  ground-service-tests:
    name: Ground Ingest & Round-Trip Pytest Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ground/requirements.txt pytest

      - name: Generate Synthetic Test Frames
        run: python ground/synthetic/gen_frames.py

      - name: Run Pytest Test Suite
        run: pytest ground/tests/ -v

  dashboard-build:
    name: React Web Ground Station Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build Production Bundle
        run: npm run build
